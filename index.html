<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paulina Kaczmarek</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #1f2937; }
        body { margin: 0; }
        main { width: min(100% - 2rem, 760px); margin: 2rem auto; }
        h1 { color: blue; }
        h1 span { color: red; }
        .calendar-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
        .calendar-header h2 { margin: 0; text-transform: capitalize; }
        .legend, #calendar-status { margin: .5rem 0; font-size: .875rem; color: #4b5563; }
        .legend span { margin-right: .75rem; }
        .legend span::before { content: ""; display: inline-block; width: .65rem; height: .65rem; margin-right: .25rem; border-radius: 50%; background: var(--color); }
        .weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .25rem; }
        .weekdays { margin-top: 1rem; font-size: .75rem; text-align: center; color: #6b7280; }
        .calendar-grid { margin-top: .25rem; }
        .day { position: relative; min-height: 4.25rem; padding: .35rem; border: 1px solid #e5e7eb; border-radius: .35rem; }
        .day--empty { border-color: transparent; }
        .day-number { font-size: .875rem; }
        .marker { position: relative; display: block; width: .85rem; height: .85rem; margin-top: .35rem; padding: 0; border: 0; border-radius: 50%; background: var(--marker-color); cursor: pointer; }
        .marker:focus-visible { outline: 2px solid #111827; outline-offset: 2px; }
        .card { display: none; position: absolute; z-index: 1; top: 1.3rem; left: 0; width: 12rem; padding: .5rem; border: 1px solid #d1d5db; border-radius: .35rem; background: #fff; box-shadow: 0 .25rem .75rem rgb(0 0 0 / 20%); text-align: left; color: #1f2937; }
        .marker:hover .card, .marker:focus .card, .marker.is-open .card { display: block; }
        .day:nth-child(7n) .card { right: 0; left: auto; }
        .card img { display: block; width: 100%; max-height: 10rem; object-fit: contain; border-radius: .2rem; }
        .card-icon { display: block; font-size: 2rem; }
        .card-title, .card-season { display: block; margin-top: .35rem; }
        .card-title { font-weight: 700; }
        @media (max-width: 420px) {
            main { width: min(100% - 1rem, 760px); margin: 1rem auto; }
            .day { min-height: 3.5rem; }
            .card { width: min(12rem, 80vw); }
        }
    </style>
</head>
<body>
<main>
    <h1><span>H</span>ELLO WORLD<span>!</span></h1>
    <section aria-labelledby="calendar-title">
        <div class="calendar-header">
            <h2 id="calendar-title"></h2>
        </div>
        <p class="legend" aria-label="Legenda">
            <span style="--color: #2563eb">czytam</span>
            <span style="--color: #dc2626">oglądam</span>
            <span style="--color: #16a34a">sport</span>
        </p>
        <p id="calendar-status" role="status"></p>
        <div class="weekdays" aria-hidden="true"><span>Pn</span><span>Wt</span><span>Śr</span><span>Cz</span><span>Pt</span><span>Sb</span><span>Nd</span></div>
        <div id="calendar" class="calendar-grid" aria-label="Kalendarz bieżącego miesiąca"></div>
    </section>
</main>
<script>
    const calendar = document.querySelector("#calendar");
    const status = document.querySelector("#calendar-status");
    const title = document.querySelector("#calendar-title");
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const monthLabel = new Intl.DateTimeFormat("pl-PL", { month: "long", year: "numeric" }).format(today);
    const colors = { reading: "#2563eb", watching: "#dc2626", sport: "#16a34a" };
    const icons = { reading: "📖", watching: "📺", sport: "🏃" };

    title.textContent = monthLabel;

    function validDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        const date = new Date(`${value}T00:00:00Z`);
        return !Number.isNaN(date) && date.toISOString().slice(0, 10) === value;
    }

    function validEntry(entry) {
        return entry && typeof entry.id === "string" && typeof entry.title === "string"
            && ["reading", "watching", "sport"].includes(entry.kind) && Array.isArray(entry.periods)
            && entry.periods.some(period => period && validDate(period.startDate) && validDate(period.endDate) && period.startDate <= period.endDate);
    }

    function monthDays(entry) {
        const dates = [];
        for (let day = 1; day <= daysInMonth; day += 1) {
            const date = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            if (entry.periods.some(period => period && validDate(period.startDate) && validDate(period.endDate) && period.startDate <= date && date <= period.endDate)) dates.push(day);
        }
        return dates;
    }

    function marker(entry, day) {
        const button = document.createElement("button");
        const card = document.createElement("span");
        const cardId = `event-${entry.id}-${day}`;
        const icon = entry.icon || icons[entry.kind];
        const color = entry.kind === "sport" && CSS.supports("color", entry.color) ? entry.color : colors[entry.kind];

        button.type = "button";
        button.className = "marker";
        button.style.setProperty("--marker-color", color);
        button.setAttribute("aria-label", `${entry.kind === "reading" ? "Czytam" : entry.kind === "watching" ? "Oglądam" : "Sport"}: ${entry.title}`);
        button.setAttribute("aria-describedby", cardId);
        button.setAttribute("aria-expanded", "false");
        card.className = "card";
        card.id = cardId;
        card.setAttribute("role", "tooltip");
        if (typeof entry.coverUrl === "string" && (/^https:\/\//.test(entry.coverUrl) || /^data\/medialog-covers\/[^/]+$/.test(entry.coverUrl))) {
            const image = document.createElement("img");
            image.src = entry.coverUrl;
            image.alt = "";
            image.loading = "lazy";
            card.append(image);
        } else {
            const iconElement = document.createElement("span");
            iconElement.className = "card-icon";
            iconElement.textContent = icon;
            card.append(iconElement);
        }
        const eventTitle = document.createElement("span");
        eventTitle.className = "card-title";
        eventTitle.textContent = entry.title;
        card.append(eventTitle);
        if (Number.isInteger(entry.seasonNumber)) {
            const season = document.createElement("span");
            season.className = "card-season";
            season.textContent = `sezon ${entry.seasonNumber}`;
            card.append(season);
        }
        button.append(card);
        button.addEventListener("click", () => {
            const open = !button.classList.contains("is-open");
            document.querySelectorAll(".marker.is-open").forEach(item => {
                item.classList.remove("is-open");
                item.setAttribute("aria-expanded", "false");
            });
            button.classList.toggle("is-open", open);
            button.setAttribute("aria-expanded", String(open));
        });
        return button;
    }

    function render(entries) {
        const cells = new Map();
        const offset = (new Date(year, month, 1).getDay() + 6) % 7;
        for (let index = 0; index < offset; index += 1) {
            const blank = document.createElement("div");
            blank.className = "day day--empty";
            blank.setAttribute("aria-hidden", "true");
            calendar.append(blank);
        }
        for (let day = 1; day <= daysInMonth; day += 1) {
            const cell = document.createElement("div");
            const number = document.createElement("span");
            cell.className = "day";
            number.className = "day-number";
            number.textContent = day;
            cell.append(number);
            calendar.append(cell);
            cells.set(day, cell);
        }

        const occupied = new Set();
        entries.forEach(entry => {
            const available = monthDays(entry).filter(day => !occupied.has(day));
            if (!available.length) return;
            const preferred = monthDays(entry)[0];
            const day = available.reduce((closest, candidate) => Math.abs(candidate - preferred) < Math.abs(closest - preferred) ? candidate : closest);
            occupied.add(day);
            cells.get(day).append(marker(entry, day));
        });
    }

    async function loadCalendar() {
        const sources = await Promise.allSettled(["data/medialog.json", "data/sport.json"].map(async path => {
            const response = await fetch(path);
            if (!response.ok) throw new Error(`${path}: ${response.status}`);
            const data = await response.json();
            if (data.schemaVersion !== 1 || !Array.isArray(data.entries)) throw new Error(`${path}: nieprawidłowy format`);
            return data.entries.filter(validEntry);
        }));
        const failed = sources.some(source => source.status === "rejected");
        if (failed) status.textContent = "Nie udało się wczytać części danych kalendarza.";
        render(sources.flatMap(source => source.status === "fulfilled" ? source.value : []));
    }

    loadCalendar();
</script>
</body>
</html>
